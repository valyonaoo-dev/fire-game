<style>
:root{--gold:#ffd36b;--red:#ff453a;--green:#45da82;--muted:#c9ced8;--text:#f6f7fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Segoe UI,Arial,sans-serif;color:var(--text);background:radial-gradient(circle at 18% 12%,rgba(255,116,42,.24),transparent 28%),radial-gradient(circle at 82% 8%,rgba(66,146,255,.18),transparent 28%),linear-gradient(135deg,#050608,#171c27 48%,#2e1110);padding:22px}.wrap{width:min(1320px,100%);margin:auto}.hero{position:relative;border-radius:34px;padding:28px;background:linear-gradient(90deg,rgba(0,0,0,.76),rgba(0,0,0,.38)),radial-gradient(circle at 78% 40%,rgba(255,110,36,.35),transparent 32%),linear-gradient(135deg,#161d29,#351411);border:1px solid rgba(255,255,255,.15);box-shadow:0 30px 90px rgba(0,0,0,.55);overflow:hidden}.hero:after{content:"";position:absolute;right:-100px;bottom:-140px;width:520px;height:520px;background:radial-gradient(circle,rgba(255,92,34,.42),transparent 60%);filter:blur(3px)}.top{position:relative;z-index:2;display:flex;justify-content:space-between;gap:18px;align-items:flex-start}h1{margin:0 0 10px;font-size:clamp(30px,4vw,54px);line-height:1.02;letter-spacing:-.04em}p{line-height:1.42}.lead{margin:0;max-width:820px;color:#e6e8ee;font-size:18px}.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}button{border:0;border-radius:16px;padding:12px 16px;font-weight:850;cursor:pointer;background:var(--gold);color:#111;box-shadow:0 10px 24px rgba(0,0,0,.28);transition:.18s}button:hover{transform:translateY(-2px)}button.secondary{background:rgba(255,255,255,.13);color:#fff;border:1px solid rgba(255,255,255,.18)}.hud{position:relative;z-index:2;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:24px}.hud-card{padding:16px 18px;border-radius:22px;background:rgba(0,0,0,.38);border:1px solid rgba(255,255,255,.13);backdrop-filter:blur(10px)}.hud-card span{display:block;color:var(--muted);font-size:14px;margin-bottom:6px}.hud-card strong{font-size:32px;color:var(--gold) 12);overflow:hidden;cursor:pointer;transition:.2s;box-shadow:0 18px 45px rgba(0,0,0,.25)}.incident:hover{transform:translateY(-4px);border-color:rgba(255,211,107,.55)}.incident.done{border-color:var(--green);background:linear-gradient(180deg,rgba(71,217,129,.16),rgba(255,255,255,.04))}.incident.locked{opacity:.56;pointer-events:none}.scene{height:130px;border-radius:22px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 80%,rgba(255,96,35,.52),transparent 38%),linear-gradient(135deg,rgba(0,0,0,.3),rgba(255,255,255,.06));border:1px solid rgba(255,255,255,.12);position:relative;overflow:hidden}.obj{font-size:58px;filter:drop-shadow(0 10px 20px rgba(0,0,0,.45));z-index:2}.flame{position:absolute;bottom:8px;right:20px;font-size:54px;filter:drop-shadow(0 0 22px rgba(255,87,28,.9));animation:flame .8s infinite alternate ease-in-out}@keyframes flame{from{transform:scale(.96) rotate(-4deg)}to{transform:scale(1.12) rotate(4deg)}}.smoke{position:absolute;top:8px;left:15px;width:120px;height:75px;background:radial-gradient(circle,rgba(130,134,142,.38),transparent 60%);filter:blur(8px);animation:smoke 2s infinite alternate}@keyframes smoke{from{transform:translateX(-10px)}to{transform:translateX(18px)}}.incident.done .flame{display:none}.incident.done .scene:after{content:attr(data-done);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px;background:rgba(0,0,0,.42)}.incident h3{margin:14px 0 8px;font-size:20px}.incident p{margin:0;color:var(--muted);font-size:14px}.feedback{margin-top:22px;padding:18px 20px;border-radius:24px;background:rgba(0,0,0,.42);border:1px solid rgba(255,255,255,.14);min-height:86px;font-size:17px}.danger{background:linear-gradient(90deg,rgba(255,69,58,.36),rgba(255,122,47,.18));border-color:rgba(255,92,55,.5);animation:pulse .5s ease 2}@keyframes pulse{50%{transform:scale(1.01)}}.modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.72);backdrop-filter:blur(10px)}.modal.show{display:flex}.modal-card{width:min(700px,100%);border-radius:34px;background:linear-gradient(135deg,#151b26,#351411);border:1px solid rgba(255,255,255,.18);box-shadow:0 30px 90px rgba(0,0,0,.65);padding:28px;text-align:center}.big{font-size:70px;margin-bottom:8px}.modal-card h2{margin:0 0 12px;font-size:34px}.modal-card p{margin:0 0 18px;color:#e4e7ee;font-size:18px}.micro{font-size:13px;color:var(--muted);margin-top:10px}@media(max-width:1100px){.incidents{grid-template-columns:repeat(3,1fr)}}@media(max-width:850px){.incidents{grid-template-columns:repeat(2,1fr)}.hud{grid-template-columns:1fr}.top{flex-direction:column}.controls{justify-content:flex-start}}@media(max-width:560px){body{padding:12px}.hero{padding:18px;border-radius:24px}.extinguishers,.incidents{grid-template-columns:1fr}}

 барлық жағдайды сөндіріңіз. Қате таңдау үшін уақыт азаяды.',select:'Таңдалған өрт сөндіргіш: ',co2Short:'көмірқышқылды',powderShort:'ұнтақты',noSelect:'Алдымен өрт сөндіргішті таңдаңыз.',correctCo2:'Дұрыс. Кернеудегі электр жабдықтары үшін көмірқышқылды өрт сөндіргіш таңдалады.',correctPowder:'Дұрыс. Қатты жанғыш материалдарға ұнтақты өрт сөндіргіш қолайлы.',wrongTitle:'Қауіпті қате',wrongCo2:'Бұл электр жабдығы. Дұрыс емес құрал техниканы зақымдауы, көрінуді нашарлатуы және қалпына келтіруді қиындатуы мүмкін. Дұрыс таңдау — көмірқышқылды өрт сөндіргіш.',wrongPowder:'Бұл қатты жанғыш материал. Дұрыс емес құрал бықсуын тоқтатпауы мүмкін, сондықтан материал қайта тұтануы ықтимал. Дұрыс таңдау — ұнтақты өрт сөндіргіш.',penalty:'Айып: минус 10 секунд.',winTitle:'Өте жақсы!',winText:'Барлық жағдай дұрыс сөндірілді. Негізгі ереже: алдымен не жанып жатқанын анықтаңыз, содан кейін өрт сөндіргішті таңдаңыз.',loseTitle:'Уақыт аяқталды',loseText:'Нақты жағдайда кідіру қауіпті. Ойынды қайталап, өрт түрін тезірек анықтауға тырысыңыз.',failTitle:'Қате тым көп',failText:'Сөндіру құралын дұрыс таңдамау қауіпті күшейтуі мүмкін. Тапсырманы қайта орындаңыз.',modalBtn:'Жалғастыру',done:'Сөндірілді',panel:'Электр қалқаны',panelText:'Кернеудегі жабдық. Қауіпсіз таңдау қажет.',clothes:'Арнайы киім',clothesText:'Мата қатты жанғыш материалдарға жатады.',computer:'Кеңсе техникасы',computerText:'Компьютер мен электр құралдарын кез келген құралмен сөндіруге болмайды.',boxes:'Картон қораптар',boxesText:'Қағаз бен картон жануды тез қолдайды.',socket:'Артық жүктелген розетка',socketText:'Өрт электрмен және қысқа тұйықталу қаупімен байланысты.',paper:'Құжаттар жинағы',paperText:'Қағаз оңай тұтанып, жалынды тез таратады.',heater:'Жылытқыш',heaterText:'Электр құралы желіге қосылған. Алдымен электр қаупін бағалаңыз.',wood:'Ағаш паллет',woodText:'Ағаш — қатты жанғыш материал, бықсу және қайта тұтану қаупі бар.'}};
let lang='ru',selected=null,score=0,mistakes=0,timeLeft=120,timer=null,gameOver=false;const maxTime=120,$=id=>document.getElementById(id),feedback=$('feedback');function t(k){return dict[lang][k]||k}function renderItems(){const box=$('incidents');box.innerHTML='';items.forEach(it=>{const el=document.createElement('article');el.className='incident';el.dataset.answer=it.answer;el.dataset.done=t('done');el.innerHTML=`<div class="scene"><div class="smoke"></div><div class="obj">${it.icon}</div><div class="flame">🔥</div></div><h3>${t(it.id)}</h3><p>${t(it.id+'Text')}</p>`;el.onclick=()=>chooseIncident(el);box.appendChild(el)})}function translate(){document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));$('langBtn').textContent=t('langBtn');$('modalBtn').textContent=t('modalBtn');renderItems();feedback.textContent=t('startText')}document.querySelectorAll('.ext').forEach(el=>{el.onclick=()=>{if(gameOver)return;startTimer();document.querySelectorAll('.ext').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');selected=el.dataset.type;feedback.classList.remove('danger');feedback.textContent=t('select')+(selected==='co2'?t('co2Short'):t('powderShort'))+'.'}});function chooseIncident(card){if(gameOver||card.classList.contains('done'))return;startTimer();if(!selected){feedback.textContent=t('noSelect');feedback.classList.add('danger');setTimeout(()=>feedback.classList.remove('danger'),800);return}const answer=card.dataset.answer;if(selected===answer){card.classList.add('done');score++;$('score').textContent=score;feedback.classList.remove('danger');feedback.textContent=answer==='co2'?t('correctCo2'):t('correctPowder');if(score===items.length)endGame('win')}else{mistakes++;$('mistakes').textContent=mistakes;timeLeft=Math.max(0,timeLeft-10);updateTimer();const msg=(answer==='co2'?t('wrongCo2'):t('wrongPowder'))+' '+t('penalty');feedback.textContent=msg;feedback.classList.add('danger');showModal('⚠️',t('wrongTitle'),msg);setTimeout(()=>feedback.classList.remove('danger'),900);if(mistakes>=4)endGame('fail');if(timeLeft<=0)endGame('lose')}}function startTimer(){if(timer||gameOver)return;timer=setInterval(()=>{timeLeft--;updateTimer();if(timeLeft<=0)endGame('lose')},1000)}function updateTimer(){$('timer').textContent=timeLeft;$('timeBar').style.width=(timeLeft/maxTime*100)+'%'}function endGame(type){gameOver=true;clearInterval(timer);timer=null;document.querySelectorAll('.incident:not(.done)').forEach(x=>x.classList.add('locked'));if(type==='win')showModal('🏆',t('winTitle'),t('winText'));if(type==='lose')showModal('⏱️',t('loseTitle'),t('loseText'));if(type==='fail')showModal('🚨',t('failTitle'),t('failText'))}function resetGame(){selected=null;score=0;mistakes=0;timeLeft=maxTime;gameOver=false;clearInterval(timer);timer=null;$('score').textContent=0;$('mistakes').textContent=0;updateTimer();document.querySelectorAll('.ext').forEach(x=>x.classList.remove('selected'));renderItems();feedback.classList.remove('danger');feedback.textContent=t('startText');closeModal()}function showModal(icon,title,text){$('modalIcon').textContent=icon;$('modalTitle').textContent=title;$('modalText').textContent=text;$('modal').classList.add('show')}function closeModal(){$('modal').classList.remove('show')}$('langBtn').onclick=()=>{lang=lang==='ru'?'kk':'ru';translate();resetGame()};translate();updateTimer();
</script>
